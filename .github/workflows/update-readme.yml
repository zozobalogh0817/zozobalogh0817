name: Update dynamic README

on:
  schedule:
    - cron: '0 5 * * *'  # every day at 05:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-readme.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies for today.py integration
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil lxml

      - name: Generate today.svg cards (dark/light)
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
          # Optionally set BIRTHDAY_ISO: 'YYYY-MM-DD' to use your real birthday for the Uptime line
          # BIRTHDAY_ISO: '1990-01-31'
        run: |
          python today.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: automated profile update $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit."
          fi
